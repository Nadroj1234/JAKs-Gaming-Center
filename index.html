<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JAK Games - Home</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/games.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <div class="home-page-header">
        <img
          src="images/JAK_Games.png"
          alt="JAK Games Logo"
          class="home-logo"
        />

        <h1 class="main_header">JAK's Footy Games</h1>
        <button
          class="btn game-btn"
          onclick="window.open('https://discord.gg/eCXNTyHtK', '_blank')"
        >
          💬 Join Our Discord
        </button>
      </div>
    </header>

    <!-- HOME PAGE -->
    <main id="home-screen" class="screen">
      <div class="home-content">
        <h2 class="welcome-header">Welcome to JAK's Footy Games</h2>

        <p class="home-text">
          Welcome to JAK's Footy Games. The number one game website!
        </p>

        <button
          class="btn game-btn enter-btn"
          onclick="window.location.href = 'games.html'"
        >
          🎮 Enter Games
        </button>
      </div>
    </main>
  </body>
</html>
