<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hangman</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-dark text-light">
    <div class="container py-4">
      <!-- Home Button -->
      <div class="mb-4">
        <button
          class="btn btn-outline-light"
          onclick="window.location.href = 'index.html'"
        >
          <i class="fa-solid fa-house"></i> Home
        </button>
      </div>

      <!-- Game Card -->
      <div class="card bg-black border-secondary shadow-lg">
        <div class="card-body text-center p-4">
          <h1 class="display-5 fw-bold mb-4 text-danger"> Hangman Game </h1>

          <!-- Status -->
          <div class="mb-4">
            <p id="remaining-guesses" class="fs-5 mb-3"></p>

            <div
              class="d-flex justify-content-center align-items-center gap-3 flex-wrap"
            >
              <label for="difficulty_drop" class="fw-semibold">
                Difficulty
              </label>

              <select
                id="difficulty_drop"
                class="form-select w-auto bg-dark text-light border-secondary"
              >
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>

            <p id="category" class="mt-3 fs-5"></p>
          </div>

          <!-- Hangman SVG -->
          <div class="d-flex justify-content-center mb-4">
            <div class="bg-dark rounded p-3 border border-secondary">
              <svg
                id="hangman-svg"
                width="220"
                height="220"
                viewBox="0 0 200 200"
              >
                <!-- Gallows -->
                <line
                  x1="20"
                  y1="180"
                  x2="100"
                  y2="180"
                  stroke="#ffffff"
                  stroke-width="4"
                />
                <line
                  x1="60"
                  y1="180"
                  x2="60"
                  y2="20"
                  stroke="#ffffff"
                  stroke-width="4"
                />
                <line
                  x1="60"
                  y1="20"
                  x2="140"
                  y2="20"
                  stroke="#ffffff"
                  stroke-width="4"
                />
                <line
                  x1="140"
                  y1="20"
                  x2="140"
                  y2="40"
                  stroke="#ffffff"
                  stroke-width="4"
                />

                <!-- Head -->
                <circle
                  id="head"
                  cx="140"
                  cy="60"
                  r="20"
                  stroke="#ffffff"
                  stroke-width="3"
                  fill="transparent"
                  style="display: none"
                />

                <!-- Body -->
                <line
                  id="body"
                  x1="140"
                  y1="80"
                  x2="140"
                  y2="130"
                  stroke="#ffffff"
                  stroke-width="3"
                  style="display: none"
                />

                <!-- Arms -->
                <line
                  id="left-arm"
                  x1="140"
                  y1="100"
                  x2="110"
                  y2="90"
                  stroke="#ffffff"
                  stroke-width="3"
                  style="display: none"
                />

                <line
                  id="right-arm"
                  x1="140"
                  y1="100"
                  x2="170"
                  y2="90"
                  stroke="#ffffff"
                  stroke-width="3"
                  style="display: none"
                />

                <!-- Legs -->
                <line
                  id="left-leg"
                  x1="140"
                  y1="130"
                  x2="120"
                  y2="160"
                  stroke="#ffffff"
                  stroke-width="3"
                  style="display: none"
                />

                <line
                  id="right-leg"
                  x1="140"
                  y1="130"
                  x2="160"
                  y2="160"
                  stroke="#ffffff"
                  stroke-width="3"
                  style="display: none"
                />

                <!-- Face -->
                <g id="face" style="display: none">
                  <line
                    x1="130"
                    y1="55"
                    x2="135"
                    y2="60"
                    stroke="#ffffff"
                    stroke-width="2"
                  />
                  <line
                    x1="135"
                    y1="55"
                    x2="130"
                    y2="60"
                    stroke="#ffffff"
                    stroke-width="2"
                  />

                  <line
                    x1="145"
                    y1="55"
                    x2="150"
                    y2="60"
                    stroke="#ffffff"
                    stroke-width="2"
                  />
                  <line
                    x1="150"
                    y1="55"
                    x2="145"
                    y2="60"
                    stroke="#ffffff"
                    stroke-width="2"
                  />

                  <path
                    d="M130 70 Q140 80 150 70"
                    stroke="#ffffff"
                    stroke-width="2"
                    fill="transparent"
                  />
                </g>
              </svg>
            </div>
          </div>

          <!-- Word Display -->
          <div
            class="word-display fs-2 fw-bold mb-4 letter-spacing"
            id="word-display"
          >
          </div>

          <!-- Keyboard -->
          <div
            class="keyboard d-flex flex-wrap justify-content-center gap-2 mb-4"
            id="keyboard"
          >
          </div>

          <!-- Message -->
          <div
            class="game-message fs-4 fw-semibold mb-4"
            id="game-message"
          ></div>

          <!-- Reset -->
          <button id="reset-btn" class="btn btn-danger btn-lg px-4">
            <i class="fas fa-redo"></i> New Game
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
